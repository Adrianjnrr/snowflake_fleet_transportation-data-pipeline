name: Data Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  dbt-validate:
    name: Validate dbt Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.0 dbt-snowflake==1.12.0

      - name: Create dbt profile
        working-directory: fleet_transformations
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<EOF
          fleet_transformations:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                authenticator: snowflake_jwt
                private_key: |
                  ${SNOWFLAKE_PRIVATE_KEY}
                private_key_passphrase: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                schema: ${{ secrets.SNOWFLAKE_SCHEMA }}
                threads: 1
          EOF

      - name: Validate dbt project
        working-directory: fleet_transformations
        run: dbt parse

      - name: Run dbt tests
        working-directory: fleet_transformations
        run: dbt test

  python-validate:
    name: Validate Python Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall ingestion

  airflow-validate:
    name: Validate Airflow DAG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Airflow
        run: |
          pip install apache-airflow

      - name: Validate Airflow DAG
        run: |
          python -m py_compile dags/fleet_pipeline.py